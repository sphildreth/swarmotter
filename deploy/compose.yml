services:
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: swarmotter-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ${GLUETUN_ENV_FILE:-gluetun.env}
    environment:
      TZ: ${TZ:-America/Chicago}
      FIREWALL: "on"
      UPDATER_PERIOD: ${UPDATER_PERIOD:-24h}
    ports:
      - "${SWARMOTTER_WEB_PORT:-9091}:9091"
    volumes:
      - "${GLUETUN_STATE_DIR:-/srv/swarmotter/gluetun}:/gluetun"
      - vpn-namespace:/run/swarmotter-vpn
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /gluetun-entrypoint healthcheck &&
          ns=$$(readlink /proc/self/ns/net) &&
          { [ "$$(cat /run/swarmotter-vpn/netns 2>/dev/null)" = "$$ns" ] ||
          (umask 022 && echo "$$ns" > /run/swarmotter-vpn/netns.tmp &&
          mv /run/swarmotter-vpn/netns.tmp /run/swarmotter-vpn/netns); }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  swarmotter:
    image: ${SWARMOTTER_IMAGE:-ghcr.io/sphildreth/swarmotter:latest}
    container_name: swarmotter
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    # config/swarmotter.container.toml.example explicitly disables in-process
    # containment only because this joins Gluetun's firewall/kill-switch
    # namespace. Do not remove this shared-namespace boundary or attach a
    # fallback bridge while using that config.
    network_mode: "service:vpn"
    stop_grace_period: 45s
    environment:
      VPN_NAMESPACE_FILE: /run/swarmotter-vpn/netns
      SWARMOTTER_API__REQUIRE_AUTH: ${SWARMOTTER_API_REQUIRE_AUTH:-true}
      SWARMOTTER_API__AUTH_TOKEN: ${SWARMOTTER_API_TOKEN:-}
    volumes:
      - "${SWARMOTTER_CONFIG_DIR:-/srv/swarmotter/config}:/etc/swarmotter"
      - "${SWARMOTTER_DOWNLOADS:-/srv/swarmotter/downloads}:/data/downloads"
      - "${SWARMOTTER_INCOMPLETE:-/srv/swarmotter/incomplete}:/data/incomplete"
      - "${SWARMOTTER_STATE:-/srv/swarmotter/state}:/var/lib/swarmotter"
      - vpn-namespace:/run/swarmotter-vpn:ro
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  vpn-namespace:
